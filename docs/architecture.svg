<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah-8a8679" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8679"/></marker><marker id="ahs-8a8679" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8679"/></marker><marker id="ah-2f5bea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bea"/></marker><marker id="ahs-2f5bea" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2f5bea"/></marker><marker id="ah-0f8a6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a6b"/></marker><marker id="ahs-0f8a6b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0f8a6b"/></marker><marker id="ah-c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ahs-c2410c" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c2410c"/></marker><marker id="ah-1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker><marker id="ahs-1d1d1f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1d1d1f"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter></defs><rect width="1600" height="1000" fill="#fbfaf7"/><text x="60" y="72" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="30" font-weight="700" fill="#1d1d1f" text-anchor="start">dori-superagent</text><text x="60" y="104" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="17" font-weight="400" fill="#5c5a54" text-anchor="start">A proactive multi-session harness: one lead, one duty loop, many lanes, all on herdr + omo.</text><g filter="url(#sh)"><rect x="640" y="140" width="320" height="64" rx="32" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/></g><text x="800" y="180" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Human</text><line x1="800" y1="206" x2="800" y2="262" stroke="#2f5bea" stroke-width="2"  marker-end="url(#ah-2f5bea)" marker-start="url(#ahs-2f5bea)"/><text x="820" y="240" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#2f5bea" text-anchor="start">one voice: only the lead talks to you</text><g filter="url(#sh)"><rect x="470" y="266" width="620" height="140" rx="14" fill="#eef2ff" stroke="#2f5bea" stroke-width="2"/></g><text x="500" y="304" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#2f5bea" text-anchor="start">LEAD</text><text x="500" y="336" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="start">omo session · turns asks into lanes · verifies READY</text><text x="500" y="366" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#3c4a8a" text-anchor="start">dori start &lt;key> --brief   ·   dori merge &lt;pr>   ·   dori done &lt;key></text><text x="500" y="392" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">never does lane work itself</text><g filter="url(#sh)"><rect x="1190" y="266" width="350" height="220" rx="14" fill="#ecfaf5" stroke="#0f8a6b" stroke-width="2"/></g><text x="1214" y="304" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#0f8a6b" text-anchor="start">DUTY</text><text x="1214" y="336" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="start">omo session + dori duty loop</text><text x="1214" y="370" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#1f4f43" text-anchor="start">· flush inboxes of idle panes</text><text x="1214" y="398" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#1f4f43" text-anchor="start">· nudge silent lanes at 10 / 20 min</text><text x="1214" y="426" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#1f4f43" text-anchor="start">· escalate to lead at 40 min</text><text x="1214" y="454" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#1f4f43" text-anchor="start">· detect lost panes</text><line x1="1190" y1="330" x2="1094" y2="330" stroke="#0f8a6b" stroke-width="2"  marker-end="url(#ah-0f8a6b)" /><text x="1142" y="360" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#0f8a6b" text-anchor="middle">[ESCALATE]</text><text x="1142" y="378" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#0f8a6b" text-anchor="middle">[LOST]</text><g filter="url(#sh)"><rect x="60" y="266" width="350" height="330" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/></g><text x="84" y="304" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#c2410c" text-anchor="start">MERGE GATE</text><text x="84" y="336" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="start">GitHub PR → main</text><text x="84" y="372" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start">dori review &lt;pr></text><text x="84" y="396" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  fresh omo reviewer</text><text x="84" y="420" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  VERDICT at exact head SHA</text><text x="84" y="444" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  → review receipt</text><text x="84" y="468" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start">dori merge &lt;pr></text><text x="84" y="492" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  receipt CLEAR at current head</text><text x="84" y="516" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  every check pass</text><text x="84" y="540" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  empty check list ≠ green</text><text x="84" y="564" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7c3a12" text-anchor="start">  → squash --match-head-commit</text><line x1="470" y1="340" x2="414" y2="340" stroke="#c2410c" stroke-width="2"  marker-end="url(#ah-c2410c)" /><text x="442" y="328" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#c2410c" text-anchor="middle">merge</text><rect x="470" y="446" width="620" height="62" rx="10" fill="#fff" stroke="#bdb8ad" stroke-width="1.5"/><text x="500" y="474" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#8a8679" text-anchor="start">PANE INBOX</text><text x="500" y="496" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#3d3b36" text-anchor="start">busy agent? queue it. idle again? deliver the queue as one batch.</text><line x1="780" y1="446" x2="780" y2="410" stroke="#2f5bea" stroke-width="2"  marker-end="url(#ah-2f5bea)" /><g filter="url(#sh)"><rect x="470" y="580" width="196" height="170" rx="14" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/></g><text x="486" y="614" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#8a8679" text-anchor="start">LANE</text><text x="486" y="644" font-family="'DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#1d1d1f" text-anchor="start">fix-login</text><text x="486" y="674" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">omo · own tab</text><text x="486" y="696" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">brief + lane rules</text><rect x="484" y="712" width="168" height="26" rx="13" fill="#f3f1ec" stroke="#f3f1ec" stroke-width="1.5"/><text x="568" y="730" font-family="'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#3d3b36" text-anchor="middle">PR #41 · tests green</text><line x1="568" y1="578" x2="568" y2="512" stroke="#8a8679" stroke-width="2"  marker-end="url(#ah-8a8679)" /><g filter="url(#sh)"><rect x="682" y="580" width="196" height="170" rx="14" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/></g><text x="698" y="614" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#8a8679" text-anchor="start">LANE</text><text x="698" y="644" font-family="'DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#1d1d1f" text-anchor="start">docs-i18n</text><text x="698" y="674" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">omo · own tab</text><text x="698" y="696" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">brief + lane rules</text><rect x="696" y="712" width="168" height="26" rx="13" fill="#f3f1ec" stroke="#f3f1ec" stroke-width="1.5"/><text x="780" y="730" font-family="'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#3d3b36" text-anchor="middle">WAITING: CI</text><line x1="780" y1="578" x2="780" y2="512" stroke="#8a8679" stroke-width="2"  marker-end="url(#ah-8a8679)" /><g filter="url(#sh)"><rect x="894" y="580" width="196" height="170" rx="14" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/></g><text x="910" y="614" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#8a8679" text-anchor="start">LANE</text><text x="910" y="644" font-family="'DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#1d1d1f" text-anchor="start">perf-cache</text><text x="910" y="674" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">omo · own tab</text><text x="910" y="696" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">brief + lane rules</text><rect x="908" y="712" width="168" height="26" rx="13" fill="#f3f1ec" stroke="#f3f1ec" stroke-width="1.5"/><text x="992" y="730" font-family="'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#3d3b36" text-anchor="middle">READY + evidence</text><line x1="992" y1="578" x2="992" y2="512" stroke="#8a8679" stroke-width="2"  marker-end="url(#ah-8a8679)" /><text x="674" y="552" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#8a8679" text-anchor="middle">[START] [REPORT] [READY]</text><line x1="1365" y1="490" x2="1365" y2="560" stroke="#0f8a6b" stroke-width="2"  marker-end="url(#ah-0f8a6b)" /><path d="M1365 560 L1365 665 L1094 665" fill="none" stroke="#0f8a6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-0f8a6b)"/><text x="1380" y="620" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#0f8a6b" text-anchor="start">[NUDGE]</text><line x1="414" y1="500" x2="560" y2="578" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-c2410c)" /><text x="235" y="624" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#c2410c" text-anchor="middle">lanes open PRs</text><rect x="60" y="640" width="350" height="110" rx="14" fill="#fff" stroke="#bdb8ad" stroke-width="1.5"/><text x="84" y="672" font-family="'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="start">~/.dori</text><text x="84" y="700" font-family="'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">lanes/  inbox/  briefs/  receipts/</text><text x="84" y="726" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start">plain JSON files, atomic writes</text><rect x="60" y="800" width="1480" height="140" rx="18" fill="#16161a" stroke="#16161a" stroke-width="1.5"/><text x="96" y="846" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="start">herdr</text><text x="196" y="846" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="17" font-weight="400" fill="#b9b6ad" text-anchor="start">the runtime every session lives on</text><rect x="96" y="868" width="340" height="46" rx="10" fill="#26262c" stroke="#34343c" stroke-width="1.5"/><text x="266" y="897" font-family="'Noto Sans CJK JP','DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#e6e3d