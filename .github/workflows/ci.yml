name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # win-dori runs upstream's `check` job on Windows and Linux (macOS users run upstream itself).
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "dori-ci"
          git config --global user.email "dori-ci@example.com"
          git config --global init.defaultBranch main
      - name: Path / personal value guard
        run: bun scripts/check-paths.ts
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: skills/dori-mode/scripts
      - run: bun run ci
      - name: Windows profile tests
        if: runner.os == 'Windows'
        timeout-minutes: 10
        working-directory: profile
        run: bun test

  e2e-herdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install herdr 0.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          # The web download path (github.com/.../releases/download) answers 504 for long stretches; the REST asset path
          # (what gh release download uses) kept answering 200 with the same bytes. Three tries with a backoff, then fail.
          for attempt in 1 2 3; do
            gh release download v0.9.5 -R herdrdev/herdr -p herdr-linux-x86_64 -O "$HOME/.local/bin/herdr" --clobber && break
            [ "$attempt" = 3 ] && exit 22
            sleep $((attempt * 20))
          done
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $HOME/.local/bin/herdr" | sha256sum -c -
          chmod +x "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: herdr --version
      - run: bun test test/e2e.test.ts test/e2e-shells.test.ts

  e2e-hc:
    runs-on: ubuntu-latest
    env:
      HC_SESSION: dori-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install hc 0.1.17
        run: |
          curl -fsSL https://releases.herdr.dev/core/install.sh | HC_VERSION=0.1.17 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hc update --version 0.1.17
      - run: hc --version
      - name: hc e2e (skipped only while the test file does not exist)
        run: |
          if [ -f test/e2e-hc.test.ts ]; then
            bun test test/e2e-hc.test.ts
          else
            echo 'SKIP e2e-hc until the test lands'
          fi

  # win-dori: the same hc e2e on Windows, hc installed the official way (herdr-core's install.ps1).
  e2e-hc-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HC_SESSION: dori-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install hc (herdr-core install.ps1)
        shell: pwsh
        run: |
          powershell -c "irm https://releases.herdr.dev/core/install.ps1 | iex"
          "$env:LOCALAPPDATA\Programs\herdr-core" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: hc --version
      - run: bun test test/e2e-hc.test.ts
